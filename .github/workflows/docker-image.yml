name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# env:
#   TIME_STAMP: ''
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    # - uses: actions/checkout@v4
    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag cleo-app:$(date +%s)
    - name: Set current date as env variable
      id: date_step
      run: echo "TIME_STAMP=$(date +%s)" >> $GITHUB_OUTPUT
      
    - name: Auth dockerHub
      uses: docker/login-action@v3.7.0
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker images
      uses: docker/build-push-action@v6.19.2
      with:
        push: true
        file: Dockerfile
        context: .
        tags: |
            ${{ secrets.DOCKER_USERNAME }}/cleo-app:latest 
            ${{ secrets.DOCKER_USERNAME }}/cleo-app:${{ steps.date_step.outputs.TIME_STAMP }}

            
